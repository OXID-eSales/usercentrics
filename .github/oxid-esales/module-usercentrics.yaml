install_shop_with_modules:
  cache:
    prepared_shop: false
  composer:
    transform: |
      {
          "require": {
              "oxid-esales/oxideshop-ce": "{{ .Data.global.composer.dev_ref }}",
              "oxid-esales/twig-component": "{{ .Data.global.composer.dev_ref }}",
              "oxid-esales/twig-admin-theme": "{{ .Data.global.composer.dev_ref }}",
              "oxid-esales/apex-theme": "{{ .Data.global.composer.dev_ref }}",
              "oxid-professional-services/usercentrics": "{{ .Data.global.composer.ref_name }}"
          },
          "repositories": {
            "oxid-professional-services/usercentrics": {
              "type": "git",
              "url": "https://github.com/OXID-eSales/usercentrics.git"
            }
          }
      }
  custom_script_container: |
    vendor/bin/oe-console oe:database:reset --db-host=mysql --db-port=3306 --db-name=example --db-user=root --db-password=root --force
    vendor/bin/oe-console oe:module:activate oxps_usercentrics
    vendor/bin/oe-console oe:theme:activate apex

runscript: &runscript
  matrix:
    script: |
      [
        "usercentrics_module:tests-unit",
        "usercentrics_module:tests-integration",
        "usercentrics_module:tests-codeception"
      ]
  composer:
    early: true
  usercentrics_module:
    path: 'vendor/oxid-professional-services/usercentrics/'

runslim:
  <<: *runscript
  matrix:
    script: |
      [
        "usercentrics_module:phpcs",
        "usercentrics_module:phpstan",
        "usercentrics_module:phpmd"
      ]

sonarcloud:
  matrix:
    testplan: '["-"]'
  strip_path: '/var/www/vendor/oxid-professional-services/usercentrics/'
  project_key: 'OXID-eSales_usercentrics'
  project_name: 'oxid-esales/usercentrics'
  parameters: |
    -Dsonar.language=php
    -Dsonar.scm.provider=git
    -Dsonar.sources=src
    -Dsonar.tests=tests
    -Dsonar.php.phpstan.reportPaths=coverage-reports/phpstan.report.json

finish:
  slack_title: 'Module {{ print $name }} ({{ .Github.RefName }}) on {{ .Github.Repository }} by {{ .Github.Actor }}'
